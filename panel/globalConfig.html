<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<title>HypersHub Global Configuration</title>
<style>
* { box-sizing: border-box; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px; padding: 20px;
  color: var(--vscode-foreground);
  background: var(--vscode-sideBar-background);
}
h1 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
h2 { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
input {
  width: 100%; padding: 6px 8px;
  border: 1px solid var(--vscode-input-border, #ccc);
  border-radius: 2px;
  background: var(--vscode-input-background);
  color: var(--vscode-input-foreground);
  font-size: 13px;
}
input:focus { outline: none; border-color: var(--vscode-focusBorder); }
button {
  padding: 6px 14px; border: none; border-radius: 2px;
  font-size: 13px; cursor: pointer;
  background: var(--vscode-button-background);
  color: var(--vscode-button-foreground);
}
button:hover { background: var(--vscode-button-hoverBackground); }
.status {
  margin-top: 12px; padding: 8px 12px; border-radius: 2px;
  display: none; font-size: 12px; white-space: pre-wrap;
}
.status.info { display: block; background: var(--vscode-editorInfo-background, #e3f2fd); }
.status.ok { display: block; background: var(--vscode-inputValidation-infoBackground, #e8f5e9); }
.status.error { display: block; background: var(--vscode-inputValidation-errorBackground, #ffebee); }
.model-list {
  max-height: 300px; overflow-y: auto;
  border: 1px dashed var(--vscode-input-border, #ccc);
  border-radius: 2px;
  background: var(--vscode-editor-background);
  color: var(--vscode-descriptionForeground);
  font-size: 12px;
}
.model-count { font-size: 12px; color: var(--vscode-descriptionForeground); margin-bottom: 4px; }
.model-item {
  display: flex; justify-content: space-between;
  padding: 4px 8px;
  border-bottom: 1px solid var(--vscode-input-border, #eee);
}
.model-item:last-child { border-bottom: none; }
.model-name { font-weight: 500; }
.model-provider { color: var(--vscode-descriptionForeground); }
.model-count { font-size: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>HypersHub Global Configuration</h1>

<div class="form-group">
  <label for="baseUrl">Base URL</label>
  <input type="text" id="baseUrl" placeholder="https://hypershub.com" value="{{baseUrl}}">
</div>

<div class="form-group">
  <label for="apiKey">API Key</label>
  <input type="text" id="apiKey" placeholder="sk-hy-..." value="{{apiKey}}">
</div>

<div style="margin-bottom:12px">
  <button id="saveBtn">Save</button>
</div>

<div id="status" class="status"></div>

<div class="form-group" style="margin-top:20px">
  <h2>Available Models</h2>
  <div id="modelCount" class="model-count">{{modelCount}}</div>
  <div id="modelList" class="model-list">{{modelListHtml}}</div>
</div>

<script nonce="{{nonce}}">
const vscode = acquireVsCodeApi();

document.getElementById('saveBtn').addEventListener('click', () => {
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!baseUrl) { setStatus('Base URL is required', 'error'); return; }
  if (!apiKey) { setStatus('API Key is required', 'error'); return; }
  setStatus('Saving...', 'info');
  vscode.postMessage({ command: 'save', data: { baseUrl, apiKey } });
});

window.addEventListener('message', (event) => {
  const msg = event.data;
  switch (msg.command) {
    case 'setModels':
      document.getElementById('modelList').innerHTML = msg.data.modelsHtml;
      document.getElementById('modelCount').textContent = msg.data.count + ' models';
      break;
    case 'saveResult':
      if (msg.data.ok) {
        setStatus(msg.data.message, 'ok');
        if (msg.data.modelsHtml) {
          document.getElementById('modelList').innerHTML = msg.data.modelsHtml;
          document.getElementById('modelCount').textContent = msg.data.count + ' models';
        }
      } else {
        setStatus(msg.data.message, 'error');
      }
      break;
    case 'error':
      setStatus(msg.data.message, 'error');
      break;
  }
});

function setStatus(text, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = text.replace(/\n/g, '<br>');
}
</script>
</body>
</html>
